[package]
name = "calendar-application"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
calendar-domain = { path = "../calendar-domain" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
chrono-tz = "=0.10.4"
zeroize = "=1.9.1"
tokio = { version = "1", features = ["time"] }
