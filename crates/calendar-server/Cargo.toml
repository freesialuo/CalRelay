[package]
name = "calendar-server"
default-run = "calendar-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
production-web = []
test-harness = ["dep:ring", "dep:base64"]

[[bin]]
name = "calendar-admin-harness"
path = "src/bin/admin_harness.rs"
required-features = ["test-harness"]

[dependencies]
ring = { version = "=0.17.14", optional = true }
base64 = { version = "=0.22.1", optional = true }

calendar-application = { path = "../calendar-application" }
calendar-adapters = { path = "../calendar-adapters" }
calendar-storage = { path = "../calendar-storage" }
axum = { version = "=0.8.6", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "=0.58.6", default-features = false }
thiserror = "2"
reqwest = { version = "=0.12.24", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"

[dev-dependencies]
reqwest = { version = "=0.12.24", default-features = false, features = ["json"] }
ring = "=0.17.14"
base64 = "=0.22.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
