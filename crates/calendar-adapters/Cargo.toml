[package]
name = "calendar-adapters"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
calendar-application = { path = "../calendar-application" }
calendar-domain = { path = "../calendar-domain" }
ical = { version = "=0.11.0", default-features = false, features = ["ical"] }
thiserror = "2"
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.22.1"
zeroize = { version = "=1.9.0", features = ["serde"] }
httpdate = "=1.0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "sync"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
rcgen = { version = "=0.14.5", default-features = false, features = ["crypto", "ring"] }
