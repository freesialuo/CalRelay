name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && 'metadata' || 'code' }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ github.sha }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    outputs:
      rust: ${{ steps.route.outputs.rust }}
      frontend: ${{ steps.route.outputs.frontend }}
      route: ${{ steps.route.outputs.route }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/ci.txt
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - name: Validate repository and fast regression tests
        run: |
          python scripts/check_repository.py
          python -m unittest discover -s tests -v
      - name: Validate current PR policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_pr.py
      - name: Route relevant checks and verify any previous code evidence
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.ci_plan plan

  rust:
    name: rust
    needs: checks
    if: needs.checks.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build locked production assets for Rust feature tests
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Show toolchain
        run: cargo --version && rustc --version
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked

  frontend:
    name: frontend
    needs: checks
    if: needs.checks.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: frontend
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend tooling
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Build local service for real OpenAPI and HTTP tests
        run: cargo build -p calendar-server --locked
      - name: Check generated types, lint and types
        working-directory: web
        run: |
          npm run check:generated
          npm run lint
          npm run typecheck
      - name: Build and check bundle credential canaries
        working-directory: web
        run: |
          npm run build
          npm run check:bundle
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser operations and real local HTTP
        working-directory: web
        run: npm test

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs: [checks, rust, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Revalidate current metadata and require relevant results
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ROUTE: ${{ needs.checks.outputs.route }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          python3 scripts/check_pr.py
          python3 -m scripts.ci_plan gate
