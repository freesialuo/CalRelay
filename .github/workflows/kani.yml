name: Kani

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/calendar-domain/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'scripts/check_kani.py'
      - 'scripts/kani-version'
      - 'tests/test_kani.py'
      - '.github/workflows/kani.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kani-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kani:
    name: kani
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Kani
        run: |
          cargo install --locked kani-verifier --version "=$(cat scripts/kani-version)"
          cargo kani setup
      - name: Prove boundaries and detect injected defects
        run: python3 scripts/check_kani.py
