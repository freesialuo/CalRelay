name: Container image

on:
  push:
    branches: ['release-request/v*', 'release-inspect/v0.1.0-alpha.1']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing vMAJOR.MINOR.PATCH[-prerelease] tag on main history
        required: true
        type: string
      publish:
        description: Publish the tested image to private GHCR (default validates only)
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: image-build-test
    if: github.ref != 'refs/heads/release-inspect/v0.1.0-alpha.1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
      image_id: ${{ steps.seal.outputs.image_id }}
      archive_sha256: ${{ steps.seal.outputs.archive_sha256 }}
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Validate event, version, exact source and latest main CI
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/scripts/image_release.py plan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.plan.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.31.0
          driver: docker
      - name: Build the production image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: source
          file: source/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: calrelay-candidate:${{ steps.plan.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/freesialuo/CalRelay
            org.opencontainers.image.revision=${{ steps.plan.outputs.sha }}
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
      - name: Exercise real image HTTP, health, storage and stop boundaries
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.plan.outputs.sha }}
        run: python3 scripts/check_docker_image.py "calrelay-candidate:$SOURCE_SHA"
      - name: Save and bind the tested image to this run and attempt
        if: steps.plan.outputs.publish == 'true'
        id: seal
        env:
          SOURCE_SHA: ${{ steps.plan.outputs.sha }}
          IMAGE_PLAN: ${{ steps.plan.outputs.plan }}
        run: |
          mkdir "$RUNNER_TEMP/container-bundle"
          docker save --output "$RUNNER_TEMP/container-bundle/image.tar" "calrelay-candidate:$SOURCE_SHA"
          python3 control/scripts/image_release.py seal --bundle "$RUNNER_TEMP/container-bundle"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.publish == 'true'
        id: upload
        with:
          name: tested-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/container-bundle/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  publish:
    name: image-publish
    needs: build
    if: >-
      github.repository == 'freesialuo/CalRelay' && needs.build.outputs.publish == 'true' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-request/v')) ||
       (github.event_name == 'release' && github.event.action == 'published') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: calrelay-ghcr-publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Load only the trusted workflow helper, never artifact scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/image_release.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/container-bundle
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.31.0
          driver: docker
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Revalidate source and publish the exact tested image
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image_id }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        run: python3 scripts/image_release.py publish --bundle "$RUNNER_TEMP/container-bundle"
      - name: Retain digest and release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/container-bundle/release-notes.md
          if-no-files-found: error
          retention-days: 30


  inspect:
    name: read-only-alpha-package-inspection
    if: >-
      github.repository == 'freesialuo/CalRelay' && github.event_name == 'push' &&
      github.ref == 'refs/heads/release-inspect/v0.1.0-alpha.1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.31.0
          driver: docker
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Read only approved alpha metadata and manifest identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.package_inspect
